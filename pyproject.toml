[build-system]
requires = ["setuptools>=82", "wheel>=0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "pytree2"
version = "0.5.5"
description = "A Python CLI utility for visualizing folder trees with sizes and counts."
authors = [{name = "Angelo Luiz Angonezi", email = "angeloangonezi2@gmail.com"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
dependencies = ["treelib>=1.8.0",
                "pandas>=2.3.3"]
keywords = ["python", "cli", "tree", "folder structure", "file size", "disk usage", "lines of code"]
classifiers = ["Development Status :: 4 - Beta",
               "Environment :: Console",
               "Intended Audience :: Developers",
               "Operating System :: OS Independent",
               "Programming Language :: Python :: 3",
               "Programming Language :: Python :: 3.10",
               "Programming Language :: Python :: 3.11",
               "Programming Language :: Python :: 3.12",
               "Topic :: Software Development :: Libraries :: Python Modules",
               "Topic :: Utilities"]

[project.urls]
Homepage = "https://github.com/angelo-angonezi/pytree"
Issues = "https://github.com/angelo-angonezi/pytree/issues"

[project.optional-dependencies]
dev = ["build>=1.4.2",
       "twine>=6.2.0",
       "wheel>=0.46.3",
       "setuptools>=82.0.1"]

[project.scripts]
pytree = "pytree.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
